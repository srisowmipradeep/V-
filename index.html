<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine? 💘</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink1: #ffe4f1;
      --pink2: #ffd1e8;
      --card: #ffffffdd;
      --yes: #ff4d8d;
      --yesHover: #ff2f78;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--pink1), var(--pink2));
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0.7; }
      to { transform: translateY(-120vh); opacity: 0; }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 94vw);
      padding: 30px 24px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .art {
      width: 240px;
      margin: 0 auto 14px;
      display: block;
    }

    h1 {
      font-family: "Pacifico", cursive;
      font-size: clamp(28px, 5vw, 46px);
      margin-bottom: 22px;
      color: #ff3b7a;
    }

    .button-zone {
      position: relative;
      width: min(520px, 100%);
      height: 150px;
      margin: 0 auto;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 28px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.15);
      transition: transform .15s ease, background .15s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
      animation: bounce 1.8s infinite;
    }

    #yesBtn:hover { background: var(--yesHover); }

    @keyframes bounce {
      0%, 100% { transform: translateY(-50%) scale(1); }
      50% { transform: translateY(-60%) scale(1.05); }
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
    }

    .hint {
      margin-top: 12px;
      font-size: 14px;
      opacity: .75;
    }

    .result {
      display: none;
      margin-top: 20px;
      animation: pop .4s ease;
    }

    .result h2 {
      font-family: "Pacifico", cursive;
      font-size: clamp(32px, 5vw, 48px);
      color: #ff2f78;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin-top: 10px;
    }
  </style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>

<!-- floating hearts -->
<script>
  for (let i = 0; i < 15; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "💗";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDelay = Math.random() * 6 + "s";
    h.style.fontSize = 16 + Math.random() * 20 + "px";
    document.body.appendChild(h);
  }
</script>

<main class="card">

  <!-- TEDDY IMAGE -->
  <img
    class="art"
    src="https://i.imgur.com/7X9ZpZL.png"
    alt="Cute Teddy Hug"
  />

  <h1>Surya 💕<br>will you be my Valentine?</h1>

  <section class="button-zone" id="zone">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙈</button>
  </section>

  <div class="hint" id="hint">will you click yes 🥹👉👈? </div>

  <section class="result" id="result">
    <h2>YAY!!! 🎉💞</h2>
    <img class="fireworks"
      src="https://github.com/srisowmipradeep/V-/blob/main/Cute%20Teddy%20Love.jpeg"
      alt="Celebration"
    />
  </section>

</main>

<script>
  const zone = document.getElementById("zone");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const result = document.getElementById("result");
  const hint = document.getElementById("hint");
  const confettiCanvas = document.getElementById("confettiCanvas");

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    confettiCanvas.width = innerWidth * dpr;
    confettiCanvas.height = innerHeight * dpr;
    confettiCanvas.style.width = "100%";
    confettiCanvas.style.height = "100%";
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const confettiInstance = confetti.create(confettiCanvas, {
    resize: false,
    useWorker: true
  });

  function celebrate() {
    const end = Date.now() + 1600;
    (function frame() {
      confettiInstance({
        particleCount: 14,
        spread: 100,
        startVelocity: 50,
        origin: { x: Math.random(), y: Math.random() * 0.3 }
      });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  let yesScale = 1;
  function growYes() {
    yesScale = Math.min(2.2, yesScale + 0.1);
    yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
  }

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function moveNo(x, y) {
    const z = zone.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();

    let dx = (b.left + b.width / 2) - x;
    let dy = (b.top + b.height / 2) - y;
    let mag = Math.hypot(dx, dy) || 1;
    dx /= mag; dy /= mag;

    let left = (b.left - z.left) + dx * 140;
    let top  = (b.top - z.top) + dy * 140;

    noBtn.style.left = clamp(left, 0, z.width - b.width) + "px";
    noBtn.style.top  = clamp(top, 0, z.height - b.height) + "px";
    noBtn.style.transform = "none";
    growYes();
  }

  zone.addEventListener("pointermove", e => {
    const b = noBtn.getBoundingClientRect();
    const d = Math.hypot(
      (b.left + b.width / 2) - e.clientX,
      (b.top + b.height / 2) - e.clientY
    );
    if (d < 140) moveNo(e.clientX, e.clientY);
  });

  yesBtn.addEventListener("click", () => {
    zone.style.display = "none";
    hint.style.display = "none";
    result.style.display = "block";
    resizeCanvas();
    celebrate();
  });
</script>

</body>
</html>
